<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearmind AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F0F4F8; /* Soft blue-grey canvas */
            --neu-base: #FFFFFF; /* Pure white elements */
            --primary: #3B82F6;  /* Confident blue */
            --accent: #F97316;   /* Energetic orange for mic/status */
            --text-main: #1F2937; /* Dark charcoal */
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; }

        /* Neumorphic Shadow Style (Soft, Raised) */
        .neu-raised {
            background-color: var(--neu-base);
            border-radius: 20px;
            box-shadow: 6px 6px 12px #e1e9f1, -6px -6px 12px #ffffff;
            border: 1px solid rgba(255,255,255,0.7);
        }
        
        /* Inner Shadow (Pressed in) */
        .neu-pressed {
            background-color: var(--bg-color) !important;
            box-shadow: inset 4px 4px 8px #e1e9f1, inset -4px -4px 8px #ffffff;
            border: none !important;
        }

        /* Accent Text Gradient */
        .accent-gradient {
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="container mx-auto max-w-4xl">
        <header class="text-center mb-10 neu-raised p-6 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 border border-blue-200 shadow-inner">
                    <i class="fas fa-brain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold accent-gradient tracking-tight">ClearMind AI</h1>
                    <p class="text-slate-500 text-sm">Light. Direct. Helpful.</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold bg-orange-100 text-orange-700 border border-orange-200">
                <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                PERSONALITY ACTIVE
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <aside class="space-y-6">
                <section class="neu-raised p-6">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 block">1. Security Key</label>
                    <div class="relative">
                        <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="apiKey" placeholder="Enter Gemini Key..." 
                            class="w-full neu-pressed p-4 pl-12 rounded-xl focus:ring-2 focus:ring-blue-300 outline-none transition text-sm">
                    </div>
                </section>

                <section class="neu-raised p-6">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 block">2. Set AI Persona</label>
                    <div class="relative">
                        <i class="fas fa-user-tag absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="systemRole" placeholder="e.g. Travel Guide, Tutor..." 
                            class="w-full neu-pressed p-4 pl-12 rounded-xl focus:ring-2 focus:ring-blue-300 outline-none transition text-sm">
                    </div>
                </section>
            </aside>

            <section class="md:col-span-2 space-y-6">
                <div class="neu-raised p-6 relative">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 block">Your Question</label>
                    <textarea id="userInput" rows="6" placeholder="Type or speak your question here..." 
                        class="w-full neu-pressed p-5 rounded-xl focus:ring-2 focus:ring-blue-300 outline-none text-base resize-none mb-4"></textarea>
                    
                    <div class="flex items-center justify-between gap-4">
                        <button id="micBtn" class="bg-orange-500 hover:bg-orange-600 w-14 h-14 rounded-full flex items-center justify-center transition-all shadow-lg active:scale-95 group">
                            <i class="fas fa-microphone text-white text-xl" id="micIcon"></i>
                        </button>
                        <button id="sendBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold text-white shadow-md transform transition active:scale-[0.98]">
                            GENERATE SOLUTION
                        </button>
                    </div>
                </div>

                <div class="neu-raised p-6 min-h-[150px]">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                        <span class="text-sm font-semibold text-slate-600 tracking-tight">AI Assistant Response</span>
                        <div class="flex gap-2 p-1 px-3 rounded-full neu-pressed border border-slate-200">
                            <button onclick="controlVoice('play')" class="text-slate-500 hover:text-blue-500 transition px-2"><i class="fas fa-play"></i></button>
                            <button onclick="controlVoice('pause')" class="text-slate-500 hover:text-orange-500 transition px-2"><i class="fas fa-pause"></i></button>
                            <button onclick="controlVoice('stop')" class="text-slate-500 hover:text-red-500 transition px-2"><i class="fas fa-stop"></i></button>
                        </div>
                    </div>
                    <div id="aiResponse" class="text-slate-800 leading-relaxed text-base italic">
                        Ready for your command...
                    </div>
                </div>
            </section>
        </main>

        <footer class="text-center mt-12 text-slate-400 text-xs">
            ClearMind AI &copy; 2024 | Personal productivity interface. Direct model connection.
        </footer>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let utterance = null;
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const userInput = document.getElementById('userInput');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            micBtn.onclick = () => {
                try {
                    recognition.start();
                    micIcon.classList.replace('fa-microphone', 'fa-circle-notch');
                    micIcon.classList.add('animate-spin');
                    micBtn.classList.add('bg-orange-600');
                } catch (e) {}
            };
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; stopMicUI(); };
            recognition.onerror = () => stopMicUI();
            recognition.onend = () => stopMicUI();
        }

        function stopMicUI() {
            micIcon.classList.replace('fa-circle-notch', 'fa-microphone');
            micIcon.classList.remove('animate-spin');
            micBtn.classList.remove('bg-orange-600');
        }

        document.getElementById('sendBtn').onclick = async () => {
            const key = document.getElementById('apiKey').value;
            const role = document.getElementById('systemRole').value || "Helpful Assistant";
            const prompt = userInput.value;
            const responseBox = document.getElementById('aiResponse');
            if (!key) return alert("Please enter your API Key!");
            if (!prompt) return alert("Please enter a question!");
            responseBox.innerHTML = '<i class="fas fa-spinner animate-spin mr-2"></i> Thinking...';
            try {
                const model = "gemini-2.5-flash";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `System Instruction: Act as a ${role}. Provide a concise, brief, and professional answer. \n\n User Question: ${prompt}` }] }] })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                const reply = data.candidates[0].content.parts[0].text;
                responseBox.innerText = reply;
                speak(reply);
            } catch (err) { responseBox.innerText = "Error: " + err.message; }
        };

        function speak(text) { synth.cancel(); utterance = new SpeechSynthesisUtterance(text); synth.speak(utterance); }
        function controlVoice(action) {
            if (action === 'play') synth.paused ? synth.resume() : speak(document.getElementById('aiResponse').innerText);
            else if (action === 'pause') synth.pause();
            else if (action === 'stop') synth.cancel();
        }
    </script>
</body>
</html>
